```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Yến Nhi</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: #08050a;
}

canvas {
  display: block;
}
</style>
</head>

<body>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color('#08050a');

// CAMERA
const camera = new THREE.PerspectiveCamera(
  38,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 27, 100);
camera.lookAt(0, 14, 0);

// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.AmbientLight(0xffffff, 1.8));

const light1 = new THREE.PointLight(0xff72bd, 100);
light1.position.set(-30, 40, 40);
scene.add(light1);

const light2 = new THREE.PointLight(0xffb7dc, 70);
light2.position.set(30, 20, -20);
scene.add(light2);

// CAKE GROUP
const cake = new THREE.Group();
scene.add(cake);

const phrase = 'HAPPY BIRTHDAY Yến Nhi';

// Tạo texture chữ trong suốt.
// Chiều ngang texture quấn quanh toàn bộ mặt trụ.
// Chiều dọc texture tạo nhiều hàng chữ sát nhau.
function createTextTexture(heightMM) {
  const canvas = document.createElement('canvas');

  canvas.width = 4096;

  // Giữ khoảng cách hàng chữ tương đối đều
  // trên cả tầng cao 20 mm và tầng cao 10 mm.
  const rowSpacingMM = 0.9;
  const rows = Math.max(
    1,
    Math.round(heightMM / rowSpacingMM)
  );

  const rowPixels = 48;
  canvas.height = rows * rowPixels;

  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.font = 'bold 36px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#ff9dce';
  ctx.shadowColor = '#ff399d';
  ctx.shadowBlur = 5;

  const phraseWidth = ctx.measureText(phrase).width;
  const horizontalGap = 24;
  const step = phraseWidth + horizontalGap;

  // Lặp nguyên cụm chữ theo chiều ngang
  // để quấn quanh chu vi hình trụ.
  for (let y = rowPixels / 2;
       y < canvas.height;
       y += rowPixels) {

    for (let x = 0;
         x < canvas.width;
         x += step) {

      ctx.fillText(phrase, x, y);
    }
  }

  const texture = new THREE.CanvasTexture(canvas);

  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = true;
  texture.needsUpdate = true;

  return texture;
}

// TẠO MỖI TẦNG BÁNH
function createTier(radius, height, centerY) {
  const texture = createTextTexture(height);

  const geometry = new THREE.CylinderGeometry(
    radius,
    radius,
    height,
    256,
    1,
    true
  );

  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    alphaTest: 0.03
  });

  const body = new THREE.Mesh(geometry, material);
  body.position.y = centerY;
  cake.add(body);

  // Viền mảnh phía trên để tạo hình dáng tầng bánh
  const rimMaterial = new THREE.MeshBasicMaterial({
    color: '#ff8fca'
  });

  const topRim = new THREE.Mesh(
    new THREE.TorusGeometry(radius, 0.07, 8, 256),
    rimMaterial
  );

  topRim.rotation.x = Math.PI / 2;
  topRim.position.y = centerY + height / 2;
  cake.add(topRim);

  // Viền dưới
  const bottomRim = new THREE.Mesh(
    new THREE.TorusGeometry(radius, 0.035, 8, 256),
    rimMaterial
  );

  bottomRim.rotation.x = Math.PI / 2;
  bottomRim.position.y = centerY - height / 2;
  cake.add(bottomRim);
}

// TẦNG DƯỚI: đường kính 40 mm, cao 20 mm
createTier(20, 20, 10);

// TẦNG TRÊN: đường kính 30 mm, cao 10 mm
createTier(15, 10, 25);

// ĐẾ BÁNH
const base = new THREE.Mesh(
  new THREE.CylinderGeometry(21, 21, 0.5, 128),
  new THREE.MeshBasicMaterial({
    color: '#72284e'
  })
);

base.position.y = -0.25;
cake.add(base);

// HẠT SÁNG TRANG TRÍ
const particles = new THREE.Group();

const particleGeometry = new THREE.SphereGeometry(
  0.09, 8, 8
);

const particleMaterial = new THREE.MeshBasicMaterial({
  color: '#ffc4e3'
});

for (let i = 0; i < 100; i++) {
  const star = new THREE.Mesh(
    particleGeometry,
    particleMaterial
  );

  star.position.set(
    (Math.random() - 0.5) * 100,
    Math.random() * 50,
    (Math.random() - 0.5) * 70
  );

  particles.add(star);
}

scene.add(particles);

// TỰ ĐỘNG XOAY BÁNH
function animate() {
  requestAnimationFrame(animate);

  cake.rotation.y += 0.003;

  renderer.render(scene, camera);
}

animate();

// RESPONSIVE
window.addEventListener('resize', () => {
  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});
</script>
</body>
</html>
